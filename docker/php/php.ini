; valori tipici di un hosting condiviso: l'applicazione deve funzionare entro questi limiti
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 12M
post_max_size = 14M
date.timezone = Europe/Rome
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
