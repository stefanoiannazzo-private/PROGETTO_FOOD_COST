<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#025e3e" />
    <title>Sei offline · Ricetta Quadra</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f4ef; color: #1f1d1a; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; }
      .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e6e1d8; border-radius: 14px; padding: 28px 24px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #5c574f; line-height: 1.5; margin: 0 0 18px; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 18px; background: #025e3e; color: #fff; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #161513; color: #f1eee8; } .card { background: #1f1d1a; border-color: #36322c; } p { color: #bdb6aa; } }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/app/brand/mark.png" alt="Ricetta Quadra" />
      <h1>Sei offline</h1>
      <p>Ricetta Quadra ha bisogno di internet per mostrarti ricette e costi sempre aggiornati. Controlla la connessione e riprova.</p>
      <button onclick="location.reload()">Riprova</button>
    </div>
    <script>window.addEventListener('online', () => location.reload())</script>
  </body>
</html>
